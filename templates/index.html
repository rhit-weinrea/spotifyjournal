<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Journal - Flask + HTMX</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- HTMX Library -->
    <script src="{{ url_for('static', filename='js/htmx.min.js') }}"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 Spotify Journal</h1>
            <p class="subtitle">Track your music journey with Flask + HTMX</p>
        </header>

        <main>
            <!-- Search Bar with HTMX -->
            <div class="search-section">
                <form hx-post="/search" 
                      hx-target="#entries-list" 
                      hx-trigger="keyup changed delay:300ms">
                    <input type="text" 
                           name="query" 
                           placeholder="Search entries..." 
                           class="search-input">
                </form>
            </div>

            <!-- Add Entry Form with HTMX -->
            <div class="add-entry-section">
                <h2>Add New Entry</h2>
                <form hx-post="/entries" 
                      hx-target="#entries-list" 
                      hx-swap="innerHTML">
                    <div class="form-group">
                        <input type="text" 
                               name="title" 
                               placeholder="Entry title (e.g., 'Discovered new artist')" 
                               required 
                               class="form-input">
                    </div>
                    <div class="form-group">
                        <textarea name="content" 
                                  placeholder="What's on your mind? Share your music thoughts..." 
                                  required 
                                  rows="4" 
                                  class="form-textarea"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Entry</button>
                </form>
            </div>

            <!-- Entries List (dynamically updated with HTMX) -->
            <div class="entries-section">
                <h2>Journal Entries</h2>
                <div id="entries-list">
                    {% include 'partials/entries.html' %}
                </div>
            </div>
        </main>

        <footer>
            <p>Built with Flask + HTMX | No page reloads needed! ✨</p>
        </footer>
    </div>
</body>
</html>
