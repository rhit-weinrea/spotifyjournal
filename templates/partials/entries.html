{% if entries %}
    {% for entry in entries %}
    <div class="entry-card" id="entry-{{ entry.id }}">
        <div class="entry-header">
            <h3>{{ entry.title }}</h3>
            <button class="btn-delete" 
                    hx-delete="/entries/{{ entry.id }}" 
                    hx-target="#entry-{{ entry.id }}" 
                    hx-swap="outerHTML swap:300ms"
                    hx-confirm="Are you sure you want to delete this entry?">
                🗑️ Delete
            </button>
        </div>
        <p class="entry-content">{{ entry.content }}</p>
        <p class="entry-timestamp">{{ entry.timestamp }}</p>
    </div>
    {% endfor %}
{% else %}
    <div class="empty-state">
        <p>📝 No entries yet. Start your music journal by adding your first entry above!</p>
    </div>
{% endif %}
